<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#08111d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Radar</title>
  <style>
    :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none; background: #08111d; }
    body { touch-action: manipulation; -webkit-user-select: none; user-select: none; }
    main { position: fixed; inset: 0; display: grid; grid-template-rows: auto 1fr auto; min-height: 0; }
    header { z-index: 2; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: max(12px, env(safe-area-inset-top)) 16px 12px; background: linear-gradient(#08111d 75%, transparent); }
    h1 { margin: 0; font-size: 18px; font-weight: 700; }
    #time { display: flex; align-items: baseline; color: #c7d7e8; font-size: 13px; text-align: right; white-space: nowrap; }
    #time .clock { width: 5ch; margin-left: 6px; color: #f5f9ff; font-size: 21px; font-weight: 800; font-variant-numeric: tabular-nums; text-align: left; }
    #stage { min-height: 0; display: grid; place-items: center; position: relative; overflow: hidden; touch-action: none; }
    #map-layer { position: absolute; inset: 0; transform: translate3d(var(--pan-x, 0px), var(--pan-y, 0px), 0) scale(var(--zoom, 1)); transform-origin: center; will-change: transform; }
    #radar { display: block; width: 100%; height: 100%; object-fit: contain; }
    #message { position: absolute; inset: 0; display: grid; place-items: center; padding: 30px; text-align: center; color: #c7d7e8; line-height: 1.45; }
    .hidden { display: none !important; }
    #calibration { position: absolute; z-index: 3; top: 10px; left: 10px; right: 10px; max-width: 440px; margin: auto; padding: 12px; border: 1px solid #6a91b8; border-radius: 14px; background: #08111de8; box-shadow: 0 4px 18px #0009; color: #eaf5ff; text-align: center; pointer-events: auto; }
    #calibration strong { display: block; margin-bottom: 4px; }
    #calibration p { margin: 0 0 10px; color: #c7d7e8; font-size: 13px; line-height: 1.35; }
    #calibration-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    #calibration-actions button { min-height: 42px; padding: 7px; font-size: 13px; }
    #calibration-actions button.selected { background: #0d6ebd; outline: 2px solid #9bd5ff; }
    #calibration-status { margin-top: 9px; color: #9bd5ff; font-size: 12px; line-height: 1.3; }
    #calibration-clear { margin-top: 8px; min-height: 32px; padding: 4px 10px; background: #304861; font-size: 12px; }
    footer { z-index: 2; padding: 12px 16px max(14px, env(safe-area-inset-bottom)); background: linear-gradient(transparent, #08111d 28%); }
    #timeline { position: relative; height: 64px; margin: 0 14px 10px; cursor: pointer; touch-action: none; -webkit-tap-highlight-color: transparent; }
    #timeline::before, #timeline-fill { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 10px; transform: translateY(-50%); border-radius: 999px; }
    #timeline::before { background: #47627d; }
    #timeline-fill { right: auto; width: var(--progress, 0%); background: #3ca7ff; }
    #timeline-thumb { position: absolute; top: 50%; left: var(--progress, 0%); width: 30px; height: 30px; transform: translate(-50%, -50%); border: 3px solid #eaf5ff; border-radius: 50%; background: #0d6ebd; box-shadow: 0 2px 7px #0008; }
    #location-marker { position: absolute; z-index: 1; width: 20px; height: 20px; transform: translate(-50%, -50%) scale(var(--marker-scale, 1)); border: 2px solid white; border-radius: 50%; background: #1687ff; box-shadow: 0 0 0 6px #1687ffbb, 0 2px 8px #0008; pointer-events: none; }
    #location-marker::after { content: ""; position: absolute; inset: -22px; border: 4px solid #9bd5ff; border-radius: 50%; animation: location-pulse 1.8s ease-out infinite; }
    @keyframes location-pulse { from { transform: scale(.35); opacity: 1; } to { transform: scale(1); opacity: 0; } }
    .controls { display: grid; grid-template-columns: repeat(5, 1fr); gap: 9px; }
    button { min-height: 48px; border: 0; border-radius: 12px; color: #f8fbff; background: #1c334d; font: inherit; font-size: 16px; font-weight: 650; touch-action: manipulation; }
    button:active { background: #2d5680; transform: scale(.98); }
    #refresh { background: #0d6ebd; }
    @media (orientation: landscape) {
      main { grid-template-columns: minmax(140px, 22vw) 1fr; grid-template-rows: 1fr; }
      header { grid-column: 1; grid-row: 1; align-items: flex-start; flex-direction: column; justify-content: flex-start; background: #08111d; }
      #time { text-align: left; }
      #stage { grid-column: 2; grid-row: 1; }
      footer { grid-column: 1; grid-row: 1; align-self: end; padding-top: 0; background: #08111d; }
      .controls { grid-template-columns: repeat(2, 1fr); }
      #timeline { height: 72px; }
    }
  </style>
</head>
<body>
  <main>
    <header><h1>Hungary radar</h1><div id="time">Loading radar…</div></header>
    <section id="stage"><div id="map-layer"><img id="radar" class="hidden" alt="Hungary precipitation radar"><div id="location-marker" class="hidden" aria-label="Your location"></div></div><div id="message">Finding the newest HungaroMet radar image…</div><aside id="calibration" class="hidden" aria-live="polite"><strong>Map-position check</strong><p>Choose a landmark, zoom and pan to it, then arm a precise map tap.</p><div id="calibration-actions"><button data-landmark="balaton">1. West end of Lake Balaton</button><button data-landmark="tisza">2. North end of Tisza-tó</button></div><div id="calibration-status">Choose the first landmark to begin.</div><button id="calibration-clear" class="hidden">Clear saved calibration</button></aside></section>
    <footer>
      <div id="timeline" role="slider" aria-label="Radar time" aria-valuemin="0" aria-valuemax="0" aria-valuenow="0" tabindex="0"><div id="timeline-fill"></div><div id="timeline-thumb"></div></div>
      <div class="controls">
        <button id="back" aria-label="Previous radar frame">‹</button>
        <button id="play" aria-label="Play radar animation">Play</button>
        <button id="next" aria-label="Next radar frame">›</button>
        <button id="refresh">Refresh</button>
        <button id="calibrate">Calibration</button>
      </div>
    </footer>
  </main>
  <script>
    const BASE = 'https://www.met.hu/img/RccV/';
    const STEP = 5 * 60 * 1000;
    const FRAME_COUNT = 42;
    const radar = document.querySelector('#radar');
    const time = document.querySelector('#time');
    const message = document.querySelector('#message');
    const timeline = document.querySelector('#timeline');
    const mapLayer = document.querySelector('#map-layer');
    const locationMarker = document.querySelector('#location-marker');
    const calibrationPanel = document.querySelector('#calibration');
    const calibrationStatus = document.querySelector('#calibration-status');
    const calibrationClear = document.querySelector('#calibration-clear');
    const playButton = document.querySelector('#play');
    const stage = document.querySelector('#stage');
    let frames = [];
    let current = 0;
    let timer = null;
    const MIN_ZOOM = 1;
    const MAX_ZOOM = 4;
    const DEFAULT_ZOOM = (MIN_ZOOM + MAX_ZOOM) / 2;
    let zoom = DEFAULT_ZOOM;
    let panX = 0;
    let panY = 0;
    const pointers = new Map();
    let dragStart = null;
    let pinchStart = null;
    let timelinePointer = null;
    let currentLocation = null;
    let calibrationTarget = null;
    let calibrationCapture = false;
    let calibrationTap = null;
    const calibrationSamples = [];
    const calibrationMode = new URLSearchParams(location.search).has('calibrate');

    const MAP_BOUNDS = { west: 13.5, east: 25.5, north: 50.5, south: 44.004 };
    const VIEWER_IMAGE_X_CORRECTION = 0.015;
    const CALIBRATION_KEY = 'radar-map-calibration-v1';
    // Points chosen on distinct, easily recognised ends of the two water bodies.
    const LANDMARKS = {
      balaton: { name: 'the west end of Lake Balaton', latitude: 46.705, longitude: 17.255 },
      tisza: { name: 'the north end of Tisza-tó', latitude: 47.790, longitude: 20.745 }
    };

    function readCalibration() {
      try { return JSON.parse(localStorage.getItem(CALIBRATION_KEY)); } catch { return null; }
    }

    function normalisedPosition(latitude, longitude) {
      return {
        x: (longitude - MAP_BOUNDS.west) / (MAP_BOUNDS.east - MAP_BOUNDS.west),
        y: (MAP_BOUNDS.north - latitude) / (MAP_BOUNDS.north - MAP_BOUNDS.south)
      };
    }

    function filename(date) {
      const yyyy = date.getUTCFullYear();
      const mm = String(date.getUTCMonth() + 1).padStart(2, '0');
      const dd = String(date.getUTCDate()).padStart(2, '0');
      const hh = String(date.getUTCHours()).padStart(2, '0');
      const min = String(date.getUTCMinutes()).padStart(2, '0');
      return `RccV${yyyy}${mm}${dd}_${hh}${min}.jpg`;
    }

    function label(date) {
      return new Intl.DateTimeFormat('hu-HU', { dateStyle: 'medium', timeStyle: 'short', timeZone: 'Europe/Budapest' }).format(date);
    }

    function renderTime(date) {
      const datePart = new Intl.DateTimeFormat('hu-HU', { dateStyle: 'medium', timeZone: 'Europe/Budapest' }).format(date);
      const timePart = new Intl.DateTimeFormat('hu-HU', { timeStyle: 'short', timeZone: 'Europe/Budapest' }).format(date);
      return `<span>${datePart}</span><span class="clock">${timePart}</span>`;
    }

    function frameUrl(date) { return BASE + filename(date); }

    function probe(date) {
      return new Promise(resolve => {
        const image = new Image();
        const done = ok => resolve(ok ? { date, url: frameUrl(date) } : null);
        image.onload = () => done(true);
        image.onerror = () => done(false);
        image.src = frameUrl(date);
      });
    }

    async function loadFrames() {
      stop();
      radar.classList.add('hidden');
      message.classList.remove('hidden');
      message.textContent = 'Finding the newest HungaroMet radar image…';
      const rounded = new Date(Math.floor(Date.now() / STEP) * STEP);
      const candidates = Array.from({ length: FRAME_COUNT }, (_, i) => new Date(rounded - i * STEP));
      const results = await Promise.all(candidates.map(probe));
      frames = results.filter(Boolean).reverse();
      if (!frames.length) {
        message.textContent = 'No current radar image could be loaded. Check your connection and try Refresh.';
        time.textContent = 'Unavailable';
        return;
      }
      current = 0;
      show(current);
      radar.classList.remove('hidden');
      message.classList.add('hidden');
      togglePlay();
    }

    function show(index) {
      if (!frames.length) return;
      current = Math.max(0, Math.min(frames.length - 1, index));
      radar.src = frames[current].url;
      radar.alt = `Hungary precipitation radar, ${label(frames[current].date)}`;
      time.innerHTML = renderTime(frames[current].date);
      const progress = frames.length > 1 ? current / (frames.length - 1) : 0;
      timeline.style.setProperty('--progress', `${progress * 100}%`);
      timeline.setAttribute('aria-valuemax', String(Math.max(0, frames.length - 1)));
      timeline.setAttribute('aria-valuenow', String(current));
      timeline.setAttribute('aria-valuetext', label(frames[current].date));
    }

    function setMapTransform() {
      mapLayer.style.setProperty('--zoom', zoom);
      mapLayer.style.setProperty('--pan-x', `${panX}px`);
      mapLayer.style.setProperty('--pan-y', `${panY}px`);
    }

    function pointerDistance() {
      const [first, second] = [...pointers.values()];
      return Math.hypot(first.x - second.x, first.y - second.y);
    }

    function beginSinglePointer() {
      const point = pointers.values().next().value;
      dragStart = { x: point.x, y: point.y, panX, panY };
      pinchStart = null;
    }

    stage.addEventListener('pointerdown', event => {
      if (event.pointerType === 'mouse' && event.button !== 0) return;
      event.preventDefault();
      stage.setPointerCapture(event.pointerId);
      pointers.set(event.pointerId, { x: event.clientX, y: event.clientY });
      if (calibrationTarget && calibrationCapture && pointers.size === 1) {
        calibrationTap = { pointerId: event.pointerId, x: event.clientX, y: event.clientY };
        return;
      }
      if (pointers.size === 1) beginSinglePointer();
      if (pointers.size === 2) {
        pinchStart = { distance: pointerDistance(), zoom, panX, panY };
        dragStart = null;
      }
    });

    stage.addEventListener('pointermove', event => {
      if (!pointers.has(event.pointerId)) return;
      event.preventDefault();
      pointers.set(event.pointerId, { x: event.clientX, y: event.clientY });
      if (pointers.size === 2 && pinchStart) {
        zoom = Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, pinchStart.zoom * pointerDistance() / pinchStart.distance));
        if (zoom === MIN_ZOOM) { panX = 0; panY = 0; }
        setMapTransform();
      } else if (pointers.size === 1 && dragStart && zoom > 1) {
        const point = pointers.values().next().value;
        panX = dragStart.panX + point.x - dragStart.x;
        panY = dragStart.panY + point.y - dragStart.y;
        setMapTransform();
      }
    });

    function endPointer(event) {
      if (calibrationTap && calibrationTap.pointerId === event.pointerId && calibrationTarget) {
        const distance = Math.hypot(event.clientX - calibrationTap.x, event.clientY - calibrationTap.y);
        if (distance < 12) recordCalibrationTap(event.clientX, event.clientY);
        calibrationTap = null;
      }
      pointers.delete(event.pointerId);
      if (pointers.size === 1) beginSinglePointer();
      if (pointers.size === 0) { dragStart = null; pinchStart = null; }
    }
    stage.addEventListener('pointerup', endPointer);
    stage.addEventListener('pointercancel', endPointer);

    function setTimelineFromPoint(clientX) {
      if (!frames.length) return;
      const rect = timeline.getBoundingClientRect();
      const progress = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
      stop();
      show(Math.round(progress * (frames.length - 1)));
    }
    timeline.addEventListener('pointerdown', event => {
      event.preventDefault();
      timelinePointer = event.pointerId;
      timeline.setPointerCapture(event.pointerId);
      setTimelineFromPoint(event.clientX);
    });
    timeline.addEventListener('pointermove', event => {
      if (event.pointerId !== timelinePointer) return;
      event.preventDefault();
      setTimelineFromPoint(event.clientX);
    });
    timeline.addEventListener('pointerup', event => { if (event.pointerId === timelinePointer) timelinePointer = null; });
    timeline.addEventListener('pointercancel', () => { timelinePointer = null; });
    timeline.addEventListener('keydown', event => {
      if (!frames.length) return;
      if (event.key === 'ArrowLeft') { event.preventDefault(); stop(); show(current - 1); }
      if (event.key === 'ArrowRight') { event.preventDefault(); stop(); show(current + 1); }
      if (event.key === 'Home') { event.preventDefault(); stop(); show(0); }
      if (event.key === 'End') { event.preventDefault(); stop(); show(frames.length - 1); }
    });

    function positionLocationMarker() {
      if (!currentLocation || !radar.naturalWidth) return;
      const base = normalisedPosition(currentLocation.latitude, currentLocation.longitude);
      const saved = readCalibration();
      const x = saved ? base.x * saved.scaleX + saved.offsetX : base.x + VIEWER_IMAGE_X_CORRECTION;
      const y = saved ? base.y * saved.scaleY + saved.offsetY : base.y;
      if (x < 0 || x > 1 || y < 0 || y > 1) return;
      const stageRect = stage.getBoundingClientRect();
      const imageAspect = radar.naturalWidth / radar.naturalHeight;
      const stageAspect = stageRect.width / stageRect.height;
      const width = stageAspect > imageAspect ? stageRect.height * imageAspect : stageRect.width;
      const height = stageAspect > imageAspect ? stageRect.height : stageRect.width / imageAspect;
      locationMarker.style.left = `${(stageRect.width - width) / 2 + x * width}px`;
      locationMarker.style.top = `${(stageRect.height - height) / 2 + y * height}px`;
      locationMarker.style.setProperty('--marker-scale', width / radar.naturalWidth);
      locationMarker.classList.remove('hidden');
    }

    function imagePointFromClient(clientX, clientY) {
      if (!radar.naturalWidth) return null;
      const stageRect = stage.getBoundingClientRect();
      const imageAspect = radar.naturalWidth / radar.naturalHeight;
      const stageAspect = stageRect.width / stageRect.height;
      const width = stageAspect > imageAspect ? stageRect.height * imageAspect : stageRect.width;
      const height = stageAspect > imageAspect ? stageRect.height : stageRect.width / imageAspect;
      const left = stageRect.left + (stageRect.width - width) / 2;
      const top = stageRect.top + (stageRect.height - height) / 2;
      const baseX = stageRect.width / 2 + (clientX - stageRect.left - stageRect.width / 2 - panX) / zoom;
      const baseY = stageRect.height / 2 + (clientY - stageRect.top - stageRect.height / 2 - panY) / zoom;
      const x = (baseX - (stageRect.width - width) / 2) / width;
      const y = (baseY - (stageRect.height - height) / 2) / height;
      return x >= 0 && x <= 1 && y >= 0 && y <= 1 ? { x, y } : null;
    }

    function selectCalibrationTarget(key) {
      if (calibrationTarget === key) {
        calibrationCapture = true;
        calibrationStatus.textContent = `Now tap ${LANDMARKS[key].name}.`;
        document.querySelector(`[data-landmark="${key}"]`).textContent = 'Now tap the map';
        return;
      }
      calibrationTarget = key;
      calibrationCapture = false;
      calibrationTap = null;
      calibrationStatus.textContent = `Zoom and pan to ${LANDMARKS[key].name}, then tap this blue button again to arm the map tap.`;
      document.querySelectorAll('[data-landmark]').forEach(button => {
        button.classList.toggle('selected', button.dataset.landmark === key);
        button.textContent = button.dataset.landmark === 'balaton' ? '1. West end of Lake Balaton' : '2. North end of Tisza-tó';
      });
    }

    function recordCalibrationTap(clientX, clientY) {
      const imagePoint = imagePointFromClient(clientX, clientY);
      if (!imagePoint) {
        calibrationStatus.textContent = 'Please tap within the radar image.';
        return;
      }
      const landmark = LANDMARKS[calibrationTarget];
      const expected = normalisedPosition(landmark.latitude, landmark.longitude);
      const existingIndex = calibrationSamples.findIndex(sample => sample.key === calibrationTarget);
      const sample = { key: calibrationTarget, expected, imagePoint };
      if (existingIndex >= 0) calibrationSamples[existingIndex] = sample;
      else calibrationSamples.push(sample);
      calibrationTarget = null;
      calibrationCapture = false;
      const done = calibrationSamples.length === 2;
      calibrationStatus.textContent = done ? 'Both points captured — calculating…' : 'First point saved. Now select the other landmark.';
      document.querySelectorAll('[data-landmark]').forEach(button => {
        button.classList.remove('selected');
        button.textContent = button.dataset.landmark === 'balaton' ? '1. West end of Lake Balaton' : '2. North end of Tisza-tó';
      });
      if (done) applyCalibration();
    }

    function applyCalibration() {
      const first = calibrationSamples[0];
      const second = calibrationSamples[1];
      const scaleX = (second.imagePoint.x - first.imagePoint.x) / (second.expected.x - first.expected.x);
      const scaleY = (second.imagePoint.y - first.imagePoint.y) / (second.expected.y - first.expected.y);
      const offsetX = first.imagePoint.x - first.expected.x * scaleX;
      const offsetY = first.imagePoint.y - first.expected.y * scaleY;
      if (!Number.isFinite(scaleX) || !Number.isFinite(scaleY) || Math.abs(scaleX) < .5 || Math.abs(scaleY) < .5 || Math.abs(scaleX) > 1.5 || Math.abs(scaleY) > 1.5) {
        calibrationStatus.textContent = 'Those taps were too close to the wrong places. Please try both again.';
        calibrationSamples.length = 0;
        return;
      }
      localStorage.setItem(CALIBRATION_KEY, JSON.stringify({ scaleX, scaleY, offsetX, offsetY }));
      calibrationClear.classList.remove('hidden');
      calibrationStatus.textContent = 'Calibration saved on this device. Reopen the normal radar app to check your location dot.';
      positionLocationMarker();
    }

    radar.addEventListener('load', positionLocationMarker);
    window.addEventListener('resize', positionLocationMarker);
    if (navigator.geolocation) {
      navigator.geolocation.watchPosition(position => {
        currentLocation = position.coords;
        positionLocationMarker();
      }, () => {}, { enableHighAccuracy: false, maximumAge: 60000, timeout: 10000 });
    }

    function stop() {
      if (timer) clearInterval(timer);
      timer = null;
      playButton.textContent = 'Play';
      playButton.setAttribute('aria-label', 'Play radar animation');
    }

    function togglePlay() {
      if (timer) return stop();
      if (!frames.length) return;
      timer = setInterval(() => show((current + 1) % frames.length), 250);
      playButton.textContent = 'Pause';
      playButton.setAttribute('aria-label', 'Pause radar animation');
    }

    document.querySelector('#back').addEventListener('click', () => { stop(); show(current - 1); });
    document.querySelector('#next').addEventListener('click', () => { stop(); show(current + 1); });
    playButton.addEventListener('click', togglePlay);
    document.querySelector('#refresh').addEventListener('click', loadFrames);
    document.querySelector('#calibrate').addEventListener('click', () => {
      calibrationPanel.classList.remove('hidden');
      calibrationClear.classList.toggle('hidden', !readCalibration());
      calibrationStatus.textContent = 'Choose the first landmark to begin.';
      calibrationTarget = null;
      calibrationCapture = false;
    });
    document.querySelectorAll('[data-landmark]').forEach(button => button.addEventListener('click', () => selectCalibrationTarget(button.dataset.landmark)));
    calibrationClear.addEventListener('click', () => {
      localStorage.removeItem(CALIBRATION_KEY);
      calibrationClear.classList.add('hidden');
      calibrationSamples.length = 0;
      calibrationStatus.textContent = 'Saved calibration cleared.';
      positionLocationMarker();
    });
    document.addEventListener('gesturestart', event => event.preventDefault());
    setMapTransform();
    if (calibrationMode) {
      calibrationPanel.classList.remove('hidden');
      calibrationClear.classList.toggle('hidden', !readCalibration());
    }
    loadFrames();
  </script>
</body>
</html>
